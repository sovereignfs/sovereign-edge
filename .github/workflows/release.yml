name: Release build

# Task 0.3 (native build tooling): produces signed, installable internal-
# testing artifacts on both platforms, reusing the exact same scripts a
# developer runs locally (scripts/release/build-ios.sh, build-android.sh).
# No EAS Build — see docs/research/0002-react-native-framework-choice.md —
# so signing happens with this repo's own keys, imported from GitHub
# Secrets into a scratch keychain (iOS) or scratch files (Android), never a
# third-party build service.
#
# INERT UNTIL SECRETS ARE ADDED. Neither a paid Apple Developer Program
# membership nor a Google Play Console account exists yet (see
# docs/epics/infrastructure.md's task 0.3 "Known gaps"), so none of the
# secrets below are configured. Both jobs will fail cleanly at the
# import/decode step until someone adds them:
#
#   iOS:
#     IOS_DIST_CERTIFICATE_P12       — base64 of a .p12 export of the
#                                       distribution (or development, for
#                                       the free-team path) signing
#                                       certificate + private key.
#     IOS_DIST_CERTIFICATE_PASSWORD  — password the .p12 was exported with.
#     IOS_PROVISIONING_PROFILE       — base64 of the matching
#                                       .mobileprovision file.
#   Android:
#     ANDROID_RELEASE_KEYSTORE_BASE64  — base64 of release.jks.
#     ANDROID_RELEASE_KEYSTORE_PASSWORD
#     ANDROID_RELEASE_KEY_ALIAS
#     ANDROID_RELEASE_KEY_PASSWORD
#
# Deliberately out of scope: actually uploading to TestFlight or the Play
# internal track (fastlane pilot/supply, or raw App Store Connect / Play
# Developer API calls). That needs the accounts above to exist first, and
# is a documented follow-up, not stubbed out here.

on:
  workflow_dispatch:
    inputs:
      ios_export_method:
        description: iOS export method (development while only a free Personal Team exists; ad-hoc/app-store once a paid account is added)
        required: false
        default: development
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ios:
    name: iOS — signed release build
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import signing certificate and provisioning profile
        env:
          IOS_DIST_CERTIFICATE_P12: ${{ secrets.IOS_DIST_CERTIFICATE_P12 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_DIST_CERTIFICATE_P12" ] || [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "::error::IOS_DIST_CERTIFICATE_P12 / IOS_PROVISIONING_PROFILE secrets are not set yet — see this workflow's header comment."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_DIST_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/"$PROFILE_UUID.mobileprovision"

          CODE_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | sed -E 's/^[^"]*"([^"]*)".*$/\1/')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CODE_SIGN_STYLE=Manual" >> "$GITHUB_ENV"
          echo "CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build and export IPA
        env:
          EXPORT_METHOD: ${{ inputs.ios_export_method }}
        run: bash scripts/release/build-ios.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SovereignEdge-ios
          # upload-artifact resolves `path` from GITHUB_WORKSPACE, not this
          # job's `defaults.run.working-directory` (only `run:` steps get that).
          path: apps/mobile/dist/ios/SovereignEdge.ipa
          retention-days: 14

      - name: Remove scratch keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  android:
    name: Android — signed release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 and friends are not set yet — see this workflow's header comment."
            exit 1
          fi
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > release.keystore.properties <<EOF
          storePassword=$ANDROID_RELEASE_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_RELEASE_KEY_ALIAS
          keyPassword=$ANDROID_RELEASE_KEY_PASSWORD
          EOF

      - name: Build AAB + APK
        run: bash scripts/release/build-android.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SovereignEdge-android
          # upload-artifact resolves `path` from GITHUB_WORKSPACE, not this
          # job's `defaults.run.working-directory` (only `run:` steps get that).
          path: |
            apps/mobile/dist/android/SovereignEdge.aab
            apps/mobile/dist/android/SovereignEdge.apk
          retention-days: 14

      - name: Remove scratch signing files
        if: always()
        run: rm -f release.jks release.keystore.properties
