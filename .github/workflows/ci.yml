name: CI

# The fast gate — everything that does not need a native toolchain. Native
# builds live in native.yml and run on main, not on every PR.
#
# Nothing here downloads model weights or touches the network beyond the
# package registry: jest.setup.js makes fetch throw, so an accidental network
# call fails the run rather than making CI depend on a GGUF download.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    # Three ways to skip, matching `sovereign`: keep the PR a draft, add the
    # `skip-ci` label, or put [skip ci] in the head commit. The last is
    # GitHub's own behaviour and needs no condition here.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false) &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Task 1.5, threat 3. ESLint reads one file at a time and cannot see a
      # transitive route out of the offline boundary; this walks the graph.
      - name: Check the offline boundary
        run: pnpm check:offline

      # Task 5.4. Every registry/connectors.json entry embeds its manifest
      # directly, so validation is local (no external repos to clone) —
      # schema/cross-field validity via @sovereignfs/connector-sdk, plus
      # id-uniqueness and submission-shape checks.
      - name: Validate connector registry
        run: pnpm registry:check

      - name: Test
        run: pnpm test --ci
