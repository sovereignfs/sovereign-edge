# Task 14.1's own fix, found by actually running a release build, not
# assumed: `llama-cpp-sys-2`'s vendored `llama.cpp` uses
# `std::filesystem::path` unconditionally (`ggml-backend-reg.cpp`,
# `ggml-backend-dl.cpp`), which Apple's SDK marks unavailable before macOS
# 10.15. The crate's own default deployment target (10.13, when this
# variable is unset) fails to compile on current Xcode/SDK toolchains as a
# result. `MACOSX_DEPLOYMENT_TARGET` set here — not merely exported in a
# shell — is what makes the fix apply to every build (`cargo build`,
# `pnpm tauri build`, CI), not just an interactive session that happens to
# have it exported; a plain shell `export` was tried first and found to
# not reliably reach the `cmake` invocation `pnpm tauri build` spawns
# through its own subprocess chain.
#
# 11.0 is a deliberate, conservative floor, not the oldest version that
# might still technically compile: Tauri's WKWebView-based WRY and this
# app's own default Metal GPU offload (task 12.2) already imply a
# reasonably modern macOS, so there is nothing to preserve by chasing the
# lowest number that happens to build.
#
# Task 14.4's own relocation: this file originally lived at
# `src-tauri/.cargo/config.toml`. Cargo's config-file discovery walks
# *up* from the current working directory, never down — so it's only
# found if `cargo` is actually invoked from within `src-tauri/` or one of
# its own subdirectories. That held for every local invocation this repo
# had used so far, but `tauri-apps/tauri-action` (the release pipeline's
# own builder, task 14.4) runs from `apps/desktop` and never reached the
# file at its old location — confirmed by an actual CI failure showing
# the un-fixed `-mmacosx-version-min=10.13` flag despite the file
# existing and being correct. One directory up, at `apps/desktop/`, this
# file is discoverable from both `apps/desktop` and
# `apps/desktop/src-tauri` (an ancestor of both), covering every
# invocation shape this repo actually uses.
[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"
