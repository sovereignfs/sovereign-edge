<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sovereign Edge</title>
    <style>
      /*
       * Task 15.5's own splash window — a real second Tauri window rather
       * than an asset swap, shown while `main` (`"visible": false` in
       * tauri.conf.json) loads. Colors mirror mobile's own splash screen
       * (`apps/mobile/app.json`'s `expo-splash-screen` config): light
       * background/mark = `grey50`/`clay700`, dark = `grey950`/`clay300`
       * (`packages/design-tokens/primitives.ts`/`semantic.ts`) — hardcoded
       * here rather than reading CSS vars, since this window never mounts
       * `ThemeProvider` or any app JS.
       */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f7f5f0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      svg {
        width: 96px;
        height: 96px;
      }
      path,
      circle {
        stroke: #a54b2e;
      }
      circle,
      path[fill] {
        fill: #a54b2e;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #15100a;
        }
        path,
        circle {
          stroke: #e6a183;
        }
        circle,
        path[fill] {
          fill: #e6a183;
        }
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M14.8 3.98A8.5 8.5 0 1 1 12 3.5" stroke-width="1.7" stroke-linecap="round" />
      <circle cx="18.2" cy="4.6" r="1.6" />
      <path d="M12 8.2l1.1 2.7 2.7 1.1-2.7 1.1-1.1 2.7-1.1-2.7-2.7-1.1 2.7-1.1 1.1-2.7z" />
    </svg>
  </body>
</html>
