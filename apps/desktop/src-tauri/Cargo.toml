[package]
name = "sovereign-edge-desktop"
version = "0.0.0"
description = "Sovereign Edge desktop app — a privacy-first, fully offline on-device AI companion"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

# Tauri's own convention: a separate lib target (not just the `main.rs`
# binary) so mobile targets (a possible future, not this task's) can share
# the same entry point without a second copy of `run()`.
[lib]
name = "sovereign_edge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
