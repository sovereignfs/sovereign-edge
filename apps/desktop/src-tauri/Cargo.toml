[package]
name = "sovereign-edge-desktop"
version = "0.1.2"
description = "Sovereign Edge desktop app — a privacy-first, fully offline on-device AI companion"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

# Tauri's own convention: a separate lib target (not just the `main.rs`
# binary) so mobile targets (a possible future, not this task's) can share
# the same entry point without a second copy of `run()`.
[lib]
name = "sovereign_edge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "time", "sync", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
sysinfo = "0.32"
thiserror = "2"
encoding_rs = "0.8"
self_cell = "1"
# Task 14.3's own additions: the first Tauri *plugins* this app registers
# (every previous command was this app's own `#[tauri::command]`, gated by
# `build.rs`'s `AppManifest::commands` — plugin commands are ACL'd by the
# plugin's own permission identifiers instead, added to
# `capabilities/default.json` directly). `tauri-plugin-process` supplies
# `relaunch()`, which `tauri-plugin-updater` itself doesn't include.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# task 12.2's own scope: `llama-cpp-2` is target-gated rather than listed once
# in `[dependencies]` so the `metal` feature (GPU offload) is enabled only on
# macOS, mirroring mobile's Metal-on-iOS / CPU-elsewhere split. CUDA/Vulkan on
# Windows/Linux are a future task's concern, not invented speculatively here.
#
# task 12.3 adds `keyring` v3 to the same per-OS blocks (not the newer v4
# `keyring-core` redesign — v3's `Entry::new`/`set_password`/`get_password`/
# `delete_credential` API is the long-stable one, and its MSRV, 1.75, is
# already below this crate's own floor). One backend feature per OS, per
# research 0010's own naming: macOS Keychain, Windows Credential Manager,
# Linux Secret Service.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1", features = ["metal"] }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
llama-cpp-2 = "0.1"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-2 = "0.1"
keyring = { version = "3", features = ["sync-secret-service"] }
